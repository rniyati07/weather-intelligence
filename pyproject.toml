[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-intelligence-service"
version = "0.1.0"
description = "Standalone, AI-augmented Weather Intelligence Service — deterministic core, optional LLM narration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "alembic",
  "asyncpg",
  "redis",
  "httpx",
  # Imported directly for the TLS trust context in providers/base.py.
  "certifi",
  "tenacity",
  "structlog",
  "pyyaml",
  "jinja2",
  # `zoneinfo` (stdlib) has no IANA database of its own on Windows, and not
  # every minimal Linux base image ships one either — `tzdata` is the
  # official, portable fallback source Python's own docs recommend
  # depending on explicitly rather than assuming the host OS provides one.
  "tzdata",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "respx",
  "testcontainers[postgres]",
  "ruff",
  "mypy",
  "types-PyYAML",
  "import-linter",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
mypy_path = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `not live` by default: the `live` suite (tests/live/) makes real calls to
# Groq, Open-Meteo, and Overpass against a real local database — it must
# never run in CI or an ordinary `pytest`. Run it explicitly with
# `pytest -m live tests/live` once `.env` has real credentials configured.
addopts = "-ra -m \"not live\""
markers = [
  "live: hits real external services (Groq/Open-Meteo/Overpass) and a real database; excluded by default, see tests/live/README.md",
]
