services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wis
      POSTGRES_PASSWORD: wis
      POSTGRES_DB: wis
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wis"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: [.env]
    # `.env` is shared with host-run dev (`localhost:5432`/`localhost:6379`),
    # which is wrong from inside this container — override with the compose
    # service names so `docker compose up --build -d` works standalone.
    environment:
      DATABASE_URL: postgresql+asyncpg://wis:wis@postgres:5432/wis
      REDIS_URL: redis://redis:6379/0
      CACHE_BACKEND: redis
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes: { pgdata: {} }
